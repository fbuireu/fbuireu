name: GitHub Star Tracker
on:
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  track-stars:
    name: Track GitHub Stars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Track star changes
        id: tracker
        uses: fbuireu/github-star-tracker@6e11c9f5c8179daca643491ca54d74b2e8dd605b # v1.28.10
        with:
          github-token: ${{ secrets.PAT }}
          visibility: public
          exclude-repos: 'curriculum-vitae, email-signature, hashnode-articles-backup, bw'
      - name: Send email report
        if: steps.tracker.outputs.stars-changed == 'true'
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0 # v24
        with:
          server_address: ${{ vars.SMTP_SERVER }}
          server_port: ${{ vars.SMTP_PORT }}
          secure: true
          username: ${{ vars.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '⭐ Star Tracker: ${{ steps.tracker.outputs.total-stars }} stars (GitHub Action) ⭐'
          from: GitHub Star Tracker <${{ vars.MAIL_USERNAME }}>
          to: ${{ vars.MAIL_USERNAME }}
          html_body: ${{ steps.tracker.outputs.report-html }}
