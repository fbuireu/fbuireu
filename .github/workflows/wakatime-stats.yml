name: Wakatime Stats
on:
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Update WakaTime Stats Assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: false
      - name: Wait for WakaTime to finish calculating the stats
        shell: bash
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: |
          auth="Authorization: Basic $(printf '%s' "$WAKATIME_TOKEN" | base64 -w0)"
          for range in last_7_days last_year; do
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "https://wakatime.com/api/v1/users/current/stats/$range")
              echo "$range, attempt $attempt: HTTP $status"
              [ "$status" = 202 ] || break
              sleep 30
            done
          done
      - name: Use metrics (week)
        uses: gh-metrics/metrics@491b81a96df4b70e14a356a2f90e38c2e84e2b84 # master (v3.35.0-beta)
        with:
          token: NOT_NEEDED
          user: fbuireu
          filename: assets/images/svg/wakatime.svg
          output_action: none
          use_prebuilt_image: no
          template: classic
          base: ""
          plugins_errors_fatal: yes
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 7
          plugin_wakatime_limit: 8
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, editors-graphs, os, os-graphs
      - name: Use metrics (year)
        uses: gh-metrics/metrics@491b81a96df4b70e14a356a2f90e38c2e84e2b84 # master (v3.35.0-beta)
        with:
          token: NOT_NEEDED
          user: fbuireu
          filename: assets/images/svg/wakatime-year.svg
          output_action: none
          use_prebuilt_image: no
          template: classic
          base: ""
          plugins_errors_fatal: yes
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 365
          plugin_wakatime_limit: 8
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, editors-graphs, os, os-graphs
      - name: Copy the renders into the repository
        shell: bash
        run: cp /metrics_renders/assets/images/svg/wakatime.svg /metrics_renders/assets/images/svg/wakatime-year.svg assets/images/svg/
      - name: Create and auto-merge PR
        uses: $/.github/actions/create-auto-merge-pr
        with:
          token: ${{ secrets.PAT }}
          commit-message: 'docs: update the WakaTime stats cards'
          title: 'docs: update the WakaTime stats cards'
          branch: 'wakatime-update-${{ github.run_number }}'
          force-merge: 'true'
          max-retries: '5'
          retry-delay: '15'
