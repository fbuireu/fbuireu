name: Wakatime Stats
on:
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Update ${{ matrix.readme }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        readme: [README.md, README.ca.md, README.es.md, README.it.md]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Wakatime stats
        uses: athul/waka-readme@370590ad8da8f54282ed92aa42b7c25ecbd5a9a6 # master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_TOKEN }}
          TARGET_PATH: ${{ matrix.readme }}
          GH_TOKEN: ${{ secrets.PAT }}
          COMMIT_MESSAGE: 'docs: update ${{ matrix.readme }} with latest WakaTime stats'
