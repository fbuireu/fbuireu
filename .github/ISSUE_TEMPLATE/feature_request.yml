name: Feature Request
description: Suggest a new feature or improvement
title: '[Feature]: '
labels: ['enhancement', 'triage']
assignees: ['fbuireu']
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check [Discussions](../../discussions) to see whether it has been raised already.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: I would like...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
      placeholder: I also thought about...

  - type: checkboxes
    id: type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - label: A new section on the profile
        - label: A different generated report or chart
        - label: A workflow or automation change
        - label: A translation fix in one Edition
        - label: Accessibility improvement
        - label: Documentation improvement
        - label: Other

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, references, or any other context.
      placeholder: Any other relevant information...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to contribute this feature?
      options:
        - label: I'm willing to submit a PR to implement this feature
